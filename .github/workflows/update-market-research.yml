name: Update daily market research
on:
  schedule:
    - cron: '15 0,8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asset-note-daily-research
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch recent public market headlines
        run: python scripts/update_daily_brief.py
      - name: Commit research feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-brief.json
          git diff --cached --quiet || (git commit -m "Update daily market research feed" && git push)
