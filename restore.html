<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>资产笔记 · 恢复本地数据</title>
<style>*{box-sizing:border-box}body{font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f6f7f9;color:#17212b;margin:0;padding:env(safe-area-inset-top) 0 30px}main{max-width:580px;margin:36px auto;padding:16px}.card{background:#fff;border:1px solid #edf0f4;border-radius:20px;padding:24px;box-shadow:0 4px 16px #00000008}h1{font-size:25px;margin:0 0 8px}p{line-height:1.7;color:#647083}label,.btn{display:block;width:100%;padding:14px 12px;border:0;border-radius:12px;text-align:center;background:#246bfd;color:#fff;font-size:16px;font-weight:650;cursor:pointer;margin:12px 0;text-decoration:none}.secondary{background:#f0f3f8;color:#263d5a}small{color:#77808b}#status{white-space:pre-wrap;margin-top:12px;line-height:1.6}input[type=file]{display:none}</style></head><body><main><div class="card"><h1>恢复资产笔记</h1><p>新安装的 App 尚未找到本机财务数据。你的 V25 数据包可以直接导入；导入只发生在手机本地，不会上传到 GitHub。</p><label for="file">选择 V25 / 历史 JSON 数据包</label><input id="file" type="file" accept=".json,application/json"><a class="btn secondary" href="./index.html">先进入资产笔记</a><div id="status" role="status"></div><small>导入前会备份当前设备已有的数据。不要清除 Safari 网站数据。</small></div></main>
<script>
const KEY='asset_note_v5',status=document.getElementById('status');
function merge(current,incoming){
 if(!current||!current.months)return incoming;
 const out={...incoming,...current,months:{...incoming.months}};
 for(const [ym,now] of Object.entries(current.months||{})){
  const old=incoming.months[ym];
  if(!old){out.months[ym]=now;continue}
  const month={...old,...now,income:{...(old.income||{}),...(now.income||{})},expense:{...(old.expense||{}),...(now.expense||{})}};
  if((!Array.isArray(now.assets)||!now.assets.length)&&Array.isArray(old.assets)&&old.assets.length)month.assets=old.assets;
  out.months[ym]=month;
 }
 for(const key of ['annualHistory','annualSpecialSpending','investmentMonthlyHistory','salaryDeposits'])out[key]={...(incoming[key]||{}),...(current[key]||{})};
 for(const [key,value] of Object.entries(incoming)){
  if(key==='months')continue;
  const existing=out[key];
  if(existing===undefined||existing===null||(Array.isArray(existing)&&existing.length===0)||(existing&&typeof existing==='object'&&!Array.isArray(existing)&&Object.keys(existing).length===0))out[key]=value;
 }
 return out;
}
document.getElementById('file').onchange=async e=>{
 const file=e.target.files&&e.target.files[0];if(!file)return;
 try{
  const incoming=JSON.parse(await file.text());
  if(!incoming||typeof incoming!=='object'||!incoming.months||typeof incoming.months!=='object'||Array.isArray(incoming.months))throw Error('不是有效的资产笔记完整数据包');
  const raw=localStorage.getItem(KEY),current=raw?JSON.parse(raw):null;
  const result=merge(current,incoming);
  if(raw)localStorage.setItem('asset_note_before_restore_'+Date.now(),raw);
  localStorage.setItem(KEY,JSON.stringify(result));
  status.textContent='导入成功：已恢复 '+Object.keys(result.months).length+' 个月份，正在打开资产笔记…';
  location.replace('./index.html');
 }catch(err){status.textContent='导入失败：'+(err.message||String(err))+'。原有数据没有被覆盖。'}
};
</script></body></html>
